name: Compile Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Pull Global Build Tooling
        run: |
          mkdir -p lib
          curl -L -o lib/sponge-mixin.jar https://maven.org
          curl -L -o lib/fabric-loader.jar https://maven.org
          curl -L -o lib/minecraft.jar https://mojang.com

      - name: Compile Mixin Classes
        run: |
          mkdir -p build/classes
          javac -d build/classes \
                -cp "lib/*" \
                src/main/java/com/alphanostalgia/mixin/*.java

      - name: Package Mod Assets
        run: |
          mkdir -p build/libs
          cp -r src/main/resources/* build/classes/
          cd build/classes
          jar cvf ../libs/alpha-nostalgia-1.0.0.jar .

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: AlphaNostalgia-Jar
          path: build/libs/*.jar
