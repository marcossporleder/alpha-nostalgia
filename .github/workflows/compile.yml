name: Compile Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Pull Core Libraries
        run: |
          mkdir -p lib
          # Forces HTTP/1.1 and injects user-agent headers to bypass the bot detection rules
          curl --http1.1 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o lib/sponge-mixin.jar https://spongepowered.org
          curl --http1.1 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o lib/fabric-loader.jar https://fabricmc.net
          curl --http1.1 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -L -o lib/minecraft.jar https://piston-data.mojang.com/v1/objects/e877b6a07acd633fb3bb475002175cec036e7b87/client.jar

      - name: Compile Mixin Classes
        run: |
          mkdir -p build/classes
          javac -d build/classes \
                -cp "lib/*" \
                src/main/java/com/alphanostalgia/mixin/*.java

      - name: Package Mod Assets
        run: |
          mkdir -p build/libs
          cp -r src/main/resources/* build/classes/
          cd build/classes
          jar cvf ../libs/alpha-nostalgia-1.0.0.jar .

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: AlphaNostalgia-Jar
          path: build/libs/*.jar
