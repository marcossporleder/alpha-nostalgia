plugins {
    id 'net.fabricmc.fabric-loom' version '1.7.4'
}

version = '1.0.0'
group = 'com.alphanostalgia'

base {
    archivesName = "alpha-nostalgia"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21) // Uses the stable long-term compiler
}

repositories {
    mavenCentral()
    maven { url = "https://fabricmc.net" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21"
    mappings loom.officialMojangMappings() 
    
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.0+1.21"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
