plugins {
    id 'fabric-loom' version '1.17'
}

version = '1.0.0'
group = 'com.alphanostalgia'

base {
    archivesName = "alpha-nostalgia"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25) // Required for Minecraft 26.3
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    // Target dependencies for Minecraft 26.3 / 1.21.11
    minecraft "com.mojang:minecraft:26.3"
    
    // Configures Loom to pull official Mojang names automatically
    mappings loom.officialMojangMappings() 
    
    implementation "net.fabricmc:fabric-loader:0.16.0"
    implementation "net.fabricmc.fabric-api:fabric-api:0.116.13+26.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}
